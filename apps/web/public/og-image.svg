<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="50%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#blue-glow)"/>

  <!-- Border outline -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#292524" stroke-width="2"/>

  <!-- Brand Icon Badge -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <rect width="104" height="104" rx="26" fill="#1c1917" stroke="#44403c" stroke-width="2"/>
    <g fill="none" stroke="#fafaf9" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(13, 13) scale(3.25)">
      <rect width="7" height="7" x="3" y="3" rx="1.5"/>
      <rect width="7" height="7" x="14" y="3" rx="1.5"/>
      <rect width="7" height="7" x="14" y="14" rx="1.5"/>
      <rect width="7" height="7" x="3" y="14" rx="1.5"/>
    </g>
  </g>

  <!-- Title & Subtitle -->
  <text x="230" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" fill="#fafaf9" letter-spacing="-1.5">Nemokit</text>
  <rect x="495" y="128" width="170" height="34" rx="8" fill="#292524" stroke="#44403c" stroke-width="1"/>
  <text x="580" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#a8a29e" text-anchor="middle" letter-spacing="1">v0.1.0 • CLOUD ENGINE</text>

  <text x="100" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" fill="#f5f5f4" letter-spacing="-0.5">
    Private Developer Utilities &amp; Vector Studio
  </text>
  
  <text x="100" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#a8a29e">
    30+ browser-first engineering tools executing 100% in-device memory. Zero telemetry.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 395)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="44" rx="12" fill="#1c1917" stroke="#38332e" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="5" fill="#22c55e"/>
    <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e7e5e4">100% In-Browser</text>

    <!-- Pill 2 -->
    <rect x="236" y="0" width="200" height="44" rx="12" fill="#1c1917" stroke="#38332e" stroke-width="1.5"/>
    <circle cx="260" cy="22" r="5" fill="#3b82f6"/>
    <text x="278" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e7e5e4">Zero Telemetry</text>

    <!-- Pill 3 -->
    <rect x="452" y="0" width="210" height="44" rx="12" fill="#1c1917" stroke="#38332e" stroke-width="1.5"/>
    <circle cx="476" cy="22" r="5" fill="#eab308"/>
    <text x="494" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e7e5e4">Offline PWA Ready</text>

    <!-- Pill 4 -->
    <rect x="678" y="0" width="220" height="44" rx="12" fill="#1c1917" stroke="#38332e" stroke-width="1.5"/>
    <circle cx="702" cy="22" r="5" fill="#a855f7"/>
    <text x="720" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e7e5e4">MCP Server Support</text>
  </g>

  <!-- Bottom Categories Banner -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="1000" height="60" rx="14" fill="#171513" stroke="#292524" stroke-width="1"/>
    <text x="30" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#78716c">
      JSON &amp; SQL Formatter • Myers Diff • JWT Decoder • UUIDv7 • RegEx Tester • QR Studio • SVG Cleaner • PDF Tools
    </text>
  </g>
</svg>
